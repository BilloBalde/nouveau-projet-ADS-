name: CI

# Trois garanties à chaque poussée : la suite passe sur SQLite, elle passe sur
# MySQL, et le style est conforme.
#
# Les tests tournent deux fois parce que les deux moteurs ne sont pas
# interchangeables. L'application est servie par MySQL en production, mais la
# suite utilise SQLite en mémoire pour sa rapidité (deux secondes contre
# quarante). C'est cet écart qui avait laissé le tableau de bord sans aucun
# test : ses requêtes mensuelles n'étaient acceptées que par MySQL. Un seul
# des deux moteurs ne suffit donc pas — l'un dit si le code tourne en
# production, l'autre garde la suite rapide au quotidien.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancer les tests
        run: php artisan test

  tests-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coleah_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.mysql.xml rejoue la même suite en forçant la connexion MySQL.
      - name: Lancer les tests sur MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: coleah_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test -c phpunit.mysql.xml

  style:
    name: Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Contrôler le style
        run: ./vendor/bin/pint --test
